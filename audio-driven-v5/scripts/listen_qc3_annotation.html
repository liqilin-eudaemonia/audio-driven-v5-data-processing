<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QC3 · 声音事件标注</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f1f4f8;color:#172636;max-width:900px;margin:auto;padding:20px}section{background:white;padding:24px;border:1px solid #dce4ed;border-radius:12px;margin-top:20px}button,select,textarea,input{font:inherit;padding:8px;border:1px solid #aebdcb;border-radius:6px;background:white}button{cursor:pointer}audio,textarea{width:100%;margin:12px 0}#sid{overflow-wrap:anywhere}#controls{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#526779;font-size:14px}h1{font-size:24px}a{color:#076ba8}#status{color:#8f4900}</style>
<h1>声音事件标注队列</h1><p><a href="./">返回视频复核</a> · <button id="export">导出事件标注</button></p><p>这些是待标注事件，不是已有训练标签。为减少判断暗示，先听声音再展开自动证据。试听包含事件前后最多 0.25 秒；同一片段的其他声音不应自动继承这个标签。</p><p id="progress"></p><section><div id="controls"><button id="prev">上一项</button><label>序号 <input id="number" type="number" min="1" style="width:90px"></label><button id="next">下一项</button></div><h3 id="sid"></h3><p id="time"></p><audio id="audio" controls preload="metadata"></audio><label>人工标签 <select id="label"><option value="">未标注</option><option value="clean_backchannel">干净短附和</option><option value="clean_laughter_or_nonverbal">干净笑声／其他非语音反应</option><option value="environment_noise">环境噪声／处理伪影</option><option value="speaker_bleed">speaker 串音</option><option value="reaction_mixed_with_noise">真实反应＋噪声混合</option><option value="quiet">安静</option><option value="uncertain">无法确定</option></select></label><textarea id="note" placeholder="具体秒数、声音类型或需要上下文"></textarea><p id="status"></p><details><summary>查看自动分组（不是人工标签）</summary><p id="automatic"></p></details></section>
<script>
let rows=[],index=0,notes={};const $=s=>document.querySelector(s);try{notes=JSON.parse(localStorage.getItem('listen-qc3-events')||'{}')}catch{}
function key(r){return r.sample_id+'|'+r.kind+'|'+r.start+'|'+r.end}
function show(i){index=Math.max(0,Math.min(rows.length-1,i));const r=rows[index],n=notes[key(r)]||{};$('#number').value=index+1;$('#number').max=rows.length;$('#sid').textContent=r.sample_id;$('#time').textContent='片内 '+r.start.toFixed(2)+'–'+r.end.toFixed(2)+' 秒；'+(r.kind==='background'?'背景检查窗口':'局部声音事件');$('#audio').src=r.audio;$('#label').value=n.label||'';$('#note').value=n.note||'';$('#automatic').textContent=r.automatic_status+'；来源分组 '+r.group_id;$('#status').textContent='';$('#progress').textContent='共 '+rows.length+' 项；本浏览器已标注 '+Object.values(notes).filter(n=>n.label).length+' 项。标签保存在浏览器，导出后才能用于后续校准。'}
function save(){const r=rows[index];notes[key(r)]={sample_id:r.sample_id,group_id:r.group_id,start:r.start,end:r.end,kind:r.kind,label:$('#label').value,note:$('#note').value};try{localStorage.setItem('listen-qc3-events',JSON.stringify(notes));$('#status').textContent='已保存至本浏览器'}catch{$('#status').textContent='保存失败，请导出'}}
$('#prev').onclick=()=>show(index-1);$('#next').onclick=()=>show(index+1);$('#number').onchange=()=>show(Number($('#number').value)-1);$('#label').onchange=save;$('#note').oninput=save;$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({review:'qc3-event-labels',notes},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='listen_qc3_event_labels.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};fetch('annotation_queue.json').then(r=>r.json()).then(d=>{rows=d.rows;show(0)}).catch(e=>$('#progress').textContent=e.message);
</script></html>
