<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倾听数据 · 增量复核</title>
<style>@font-face{font-family:Review;src:url(review.woff)}*{box-sizing:border-box}body{margin:0;color:#183146;background:#f2f5f7;font:15px/1.6 Review,system-ui,sans-serif}header{background:#193247;color:white;padding:22px}h1{font-size:25px;margin:0}main{max-width:1400px;margin:auto;padding:18px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.panel{padding:16px;background:white;border:1px solid #d5e0e8;border-radius:8px}button,select,textarea{font:inherit;padding:7px;border:1px solid #adbfcc;border-radius:5px;background:white;max-width:100%}button{cursor:pointer}#list{display:grid;gap:7px;max-height:800px;overflow:auto}#list button{text-align:left;font-size:12px;overflow-wrap:anywhere}#list button.active{background:#e0eef9}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}video,img{width:100%;max-height:512px;object-fit:contain}video{background:#111}h2{font-size:17px;overflow-wrap:anywhere}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.notice{padding:12px;background:#eaf3f9}.muted{color:#586e80;font-size:13px}textarea{width:100%;min-height:75px}audio{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px}@media(max-width:850px){main,.views{grid-template-columns:1fr}#list{max-height:200px}}</style>
<header><h1>倾听数据 · 增量复核</h1><p id="summary">加载中…</p><p>这里展示修改规则后新增的切分片段、头肩裁剪对照，以及仍被筛掉的样本。新增部分等待试听验收，尚未计入已验收数据。</p></header>
<main><aside class="panel"><p><select id="filter"><option value="all">全部样本</option></select></p><div id="list"></div><p><button id="export">导出检查意见</button></p><a href="samples.json" download>下载样本清单</a></aside>
<section class="panel"><p class="notice">先听双轨确认谁在说话，再单听 listener。重点检查：完整句和回应有无被截断、是否只包含倾听反应、是否有 speaker 串音。身份不确定样本若难以判断，请保留“不确定”。</p>
<h2 id="sid"></h2><p id="meta" class="muted"></p><p id="reason" class="notice"></p><div class="views"><video id="video" controls preload="metadata" playsinline></video><img id="source" alt="原始画面与裁框"></div>
<div class="controls"><select id="channel"><option value="both">双轨：左 speaker / 右 listener</option><option value="speaker">只听 speaker</option><option value="listener">只听 listener</option></select><button id="head">从头播放</button><button id="tail">最后 2 秒</button><button id="next">下一段</button><a id="wav" download>listener WAV</a></div>
<div id="cropComparison" hidden><p id="cropNumbers" class="notice"></p><p>同一时刻的原紧裁框（放大至 512，用于比较脸部占比）：</p><img id="oldcrop" style="max-width:320px" alt="原紧裁框对照"></div><p id="qualityRoles" class="muted"></p><p id="text"></p><p id="events" class="muted"></p><p id="boundary" class="muted"></p><div id="flagged" class="controls"></div>
<details><summary>前后各约 8 秒的双轨上下文</summary><p id="contextmeta"></p><audio id="context" controls preload="none"></audio><pre id="contexttext"></pre></details>
<p><label>试听结论 <select id="decision"><option value="">未检查</option><option value="keep">应保留：合格 / 当前筛掉属于误杀</option><option value="reject">应筛掉：当前排除合理</option><option value="boundary">句首/句尾切分问题</option><option value="reaction">真实附和/笑声被截断</option><option value="response">混入正式回应</option><option value="noise">杂音或串音</option><option value="role">说话归属错误</option><option value="crop">裁框或清晰度问题</option><option value="uncertain">无法确定</option></select></label></p><textarea id="note" placeholder="可记录片段内秒数和具体问题"></textarea><p id="status"></p><p class="muted">检查意见保存在本浏览器；导出后再应用到数据。这里的操作不会直接放行整个数据池。</p></section></main>
<script>
const $=s=>document.querySelector(s),v=$('#video');let samples=[],visible=[],current=null,notes={},selectionHash='';
const labels={listener_content_not_confirmed_backchannel:'listener 短句尚未确认为附和',original_audio_review:'原音轨音质仍待复核',remaining_boundary_or_human_hold:'仍有边界或人工保留疑点',source_sentence_start_unconfirmed:'无法确认是否从完整句首开始',inferred_clause_end:'根据规则推断句末，完整性待核实',background_environmental_evidence:'背景环境噪声线索',environmental_sound_evidence:'环境声线索',listener_short_speech_unconfirmed:'listener 短句尚未确认为附和',untranscribed_listener_tail:'尾部有未转写的 listener 发声',end_crosses_annotated_voice:'终点落在标注人声内',end_crosses_listener_vad:'终点落在 listener 活动语音内',start_no_quiet_cut:'句首未找到安静切点',end_no_quiet_cut:'句尾未找到安静切点',insufficient_tail_room:'尾部留白不足',next_voice_guard_too_close:'接近下一次发声',start_margin_tightened_without_quiet_cut:'句首余量收紧',reaction_identity_uncertain:'声音性质不确定',listener_speech_identity_unconfirmed:'未转写人声归属不确定',strong_reference_match:'双轨高度相似',consistent_reference_leakage:'多窗口疑似串音',isolated_reference_match_requires_review:'局部双轨相似'};const why=x=>labels[x]||x;
try{notes=JSON.parse(localStorage.getItem('listen-v8-recovery-notes')||'{}')}catch{}
function channel(t=0,play=false){v.pause();v.onloadedmetadata=()=>{v.currentTime=Math.max(0,Math.min(t,v.duration-.05));if(play)v.play().catch(e=>$('#status').textContent=e.message)};v.poster=current.preview+'reference.jpg';v.src=current.preview+$('#channel').value+'.mp4'}
function choose(r){current=r;$('#context').pause();$('#sid').textContent=`${samples.indexOf(r)+1}. ${r.sample_id}`;$('#meta').textContent=`${r.review_label} · ${r.duration_s.toFixed(3)} 秒 · 原时间 ${r.start.toFixed(3)}–${r.end.toFixed(3)}s`;
$('#reason').textContent=r.review_kind.startsWith('rejected_')?`仍被筛掉的对照；请判断是否误杀。分流：${r.release.pool}；原始原因：${r.release.reasons.map(why).join('；')}；内容提示：${r.qc4.task_reasons.map(why).join('；')||'无'}；音质提示：${r.recovery.audio_reasons.map(why).join('；')||'无'}`:r.review_kind==='head_shoulders'?'扩大到头肩后的候选。请检查完整头部、肩膀构图、人脸细节和听觉质量。':r.review_kind==='asr'?'修正 ASR 区间误拦后找回的片段，请检查角色、音质和完整边界。':r.review_kind==='boundary_soft'?'音质和内容检查已通过，原来仅有边界软疑点。请重点听句首和句尾。':`人声身份仍待确认。自动提示：${r.recovery.audio_reasons.map(why).join('；')}`;
const crop=r.listener_crop;$('#cropComparison').hidden=!crop.crop_recovery;if(crop.crop_recovery){$('#oldcrop').src=r.preview+'old_tight_reference.jpg';$('#cropNumbers').textContent=`原紧裁框 ${crop.old_tight_crop.size}px → 头肩框 ${crop.size}px → 输出 512px；原图人脸短边 P10 ${crop.native_face_short_p10_px.toFixed(1)}px，输出人脸短边 P10 ${crop.output_face_short_p10_px.toFixed(1)}px，人脸高度中位数 ${crop.output_face_height_median_px.toFixed(1)}px（${(crop.output_face_height_median_px/512*100).toFixed(1)}%）。头顶依据关键点估计，完整头发需看视频确认。`;if(crop.preview_visual_adjustment)$('#cropNumbers').textContent+=' 本例做了预览构图校正：裁框纵向 '+crop.preview_visual_adjustment.y_offset_px+' 原图像素；尚未自动化，不能据此推算全量收益。';}$('#qualityRoles').textContent=Object.entries(r.qc3).map(([role,q])=>role+' 音质提示：'+(q.reasons.map(why).join('；')||'无')).join('。');$('#source').src=r.preview+'source.jpg';$('#wav').href=r.preview+'listener.wav';$('#text').textContent='Speaker 转写：'+r.text;$('#events').textContent='Listener 转写事件：'+(r.listener_events.map(e=>e.text).join('；')||'无');$('#boundary').textContent='保留的边界提示：'+(r.boundary_review_flags.map(why).join('；')||'无');$('#context').src=r.preview+'context.wav';$('#contextmeta').textContent=`上下文源时间 ${r.context.start.toFixed(2)}–${r.context.end.toFixed(2)}s；本片段从上下文第 ${r.context.clip_offset.toFixed(2)} 秒开始。左 speaker / 右 listener。`;
$('#contexttext').textContent=Object.entries(r.context.transcript).map(([role,segs])=>role+'：\n'+segs.map(s=>`${s.start.toFixed(2)}–${s.end.toFixed(2)}s ${s.text}`).join('\n')).join('\n\n');$('#decision').value=notes[r.sample_id]?.decision||'';$('#note').value=notes[r.sample_id]?.note||'';$('#status').textContent='';$('#flagged').replaceChildren();
const ranges=[...r.qc4.speech_identity_windows,...r.qc4.reference.windows.filter(x=>x.suspicious)];for(const w of ranges.slice(0,6)){const b=document.createElement('button');b.textContent=`听疑点 ${w.start.toFixed(2)}–${w.end.toFixed(2)}s`;b.onclick=()=>{$('#channel').value='listener';channel(Math.max(0,w.start-.25),true)};$('#flagged').append(b)}channel();for(const b of $('#list').children)b.classList.toggle('active',b.dataset.id===r.sample_id)}
function list(){visible=samples.filter(r=>$('#filter').value==='all'||r.review_kind===$('#filter').value);$('#list').replaceChildren();for(const r of visible){const b=document.createElement('button');b.dataset.id=r.sample_id;b.textContent=`${samples.indexOf(r)+1}. ${r.review_label} · ${r.duration_s.toFixed(2)}s\n${r.sample_id}`;b.onclick=()=>choose(r);$('#list').append(b)}if(visible.length)choose(visible[0])}
function save(){if(!current)return;notes[current.sample_id]={decision:$('#decision').value,note:$('#note').value,start:current.start,end:current.end,speaker_id:current.speaker_id,listener_id:current.listener_id,review_kind:current.review_kind};localStorage.setItem('listen-v8-recovery-notes',JSON.stringify(notes));$('#status').textContent='已保存到本浏览器'}
$('#filter').onchange=list;$('#channel').onchange=()=>channel(v.currentTime,!v.paused);$('#head').onclick=()=>channel(0,true);$('#tail').onclick=()=>channel(current.duration_s-2,true);$('#next').onclick=()=>choose(visible[(visible.indexOf(current)+1)%visible.length]);$('#decision').onchange=save;$('#note').oninput=save;v.onerror=()=>$('#status').textContent='媒体加载失败，请记录样本编号';$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({review:'v8-recovery-comparison',selection_sha256:selectionHash,notes},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='listen_v8_recovery_notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
fetch('samples.json').then(r=>{if(!r.ok)throw Error('清单加载失败');return r.json()}).then(d=>{samples=d.samples;selectionHash=d.selection_sha256;const groups=new Map();for(const r of samples){const x=groups.get(r.review_kind)||{label:r.review_label,n:0};x.n++;groups.set(r.review_kind,x)}for(const [key,x] of groups){const opt=document.createElement('option');opt.value=key;opt.textContent=x.label+'（'+x.n+'）';$('#filter').append(opt)}$('#summary').textContent=`${samples.length} 段分层抽样；含修复候选与未放行对照。抽样不代表整体通过率；每段来自不同 pair，部分样本可能同属一个身份组，未提供整对源视频，前后文可展开试听。`;list()}).catch(e=>$('#summary').textContent=e.message);
</script></html>
