<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100条 · 发声标签时间复核</title>
<style>
@font-face{font-family:review;src:url(review.woff)}*{box-sizing:border-box}body{margin:0;color:#183448;background:#eff3f6;font:14px review,system-ui,sans-serif}button,select,input,textarea{font:inherit}button,select,input{border:1px solid #bccbd6;border-radius:7px;padding:7px 11px;background:white;color:inherit}button,a{cursor:pointer}button:hover{background:#e8f4f2}button.active{background:#176c72;color:white;border-color:#176c72}button:disabled{opacity:.4;cursor:default}a{color:#176c72}header{padding:14px 22px 10px;background:#193748;color:white}h1{font-size:22px;margin:0 0 5px}p{margin:6px 0}header p{font-size:12px;color:#c9d9e0}.topbar{padding:9px 22px;background:white;border-bottom:1px solid #d9e2e8}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.groups button{font-weight:bold}.small,.muted{font-size:12px;color:#667f90}.topbar .muted{margin-left:auto}.nav{margin-top:8px}.nav select{flex:1;min-width:180px;max-width:610px}.nav input{width:150px}.workspace{display:grid;grid-template-columns:minmax(320px,40%) minmax(0,1fr);gap:14px;padding:14px 22px;height:calc(100dvh - 197px);min-height:400px}.left,.right{background:white;border:1px solid #d7e2e8;border-radius:12px;min-width:0;overflow:hidden}.left{display:flex;flex-direction:column;padding:12px;gap:9px}.videoWrap{flex:1;min-height:160px;background:#102b36;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}video{width:100%;height:100%;object-fit:contain;min-height:0;max-height:100%}.left h2{font-size:16px;margin:0}.sid{font:11px ui-monospace,monospace;overflow-wrap:anywhere;color:#607b8e}.badge{display:inline-block;padding:3px 7px;border-radius:5px;background:#e9f4f1;color:#22665a;font-size:12px}.badge.warn{background:#fff0d9;color:#8a5a15}.badge.gray{background:#edf0f3;color:#657584}.left .meta{line-height:1.7}.right{display:flex;flex-direction:column}.media{padding:12px 14px 8px;background:#f7fbfc;border-bottom:1px solid #d7e2e8;flex-shrink:0}.media button{padding:6px 10px}.media audio{width:100%;height:34px;margin-top:5px}.playback{font-size:12px;color:#447386;min-height:18px}.tabs{padding:8px 12px;border-bottom:1px solid #dbe5eb;gap:5px}.tabs button{padding:6px 9px;font-size:12px}.panel{padding:12px 14px;overflow-y:auto;min-height:0;flex:1}.card{border:1px solid #d6e2e9;border-radius:9px;margin-bottom:10px;padding:11px}.card.changed{border-left:4px solid #218581}.card.excluded{border-left:4px solid #a5adb5}.card .description{font-size:16px;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap;margin:6px 0}.timing{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.timing>div{background:#f3f7f9;border-radius:6px;padding:8px;min-width:0}.timing b{display:block;margin-bottom:5px;font-size:11px;color:#607887}.timing .new{background:#eaf6f1}.timing button{font-size:12px;padding:4px 7px;margin:2px}.evidence{font-size:12px;line-height:1.6;color:#526d7e;overflow-wrap:anywhere}.notice{padding:10px;background:#fff5e5;border-radius:7px;font-size:12px;line-height:1.6;margin-bottom:10px}.empty{padding:24px 12px;line-height:1.9;background:#f5f8fa;border-radius:8px}.empty h3{margin:0 0 8px}.timeline{margin:6px 0 10px}.track{display:grid;grid-template-columns:80px 1fr;gap:7px;align-items:center;font-size:11px;margin:4px 0}.lane{height:22px;position:relative;background:#ebf0f4;overflow:hidden;border-radius:4px}.bar{padding:0;position:absolute;height:100%;min-width:2px;border:0;border-radius:2px;opacity:.85}.cursor{position:absolute;top:0;bottom:0;width:1px;background:#dc772c;pointer-events:none}.feedback{margin-top:10px;padding-top:9px;border-top:1px solid #d9e2e8}.feedback textarea{width:100%;height:46px;border:1px solid #bccbd6;border-radius:5px;margin-top:6px;padding:6px;resize:vertical}details{margin-top:8px}summary{cursor:pointer;font-size:12px;color:#607b8e}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;max-height:250px;overflow:auto}.official{padding:9px 0;border-bottom:1px solid #e0e8ed}.official h3{font-size:14px;margin:0 0 5px}.official button{padding:4px 6px;font-size:12px;margin:3px}.error{color:#aa3829;font-size:12px}
@media(min-width:1800px){.workspace{grid-template-columns:minmax(400px,43%) minmax(0,1fr)}}
@media(max-width:800px){header{padding:12px}.topbar{padding:8px 12px}.topbar .muted{margin-left:0}.workspace{height:auto;min-height:0;display:flex;flex-direction:column;padding:10px;gap:10px}.left{position:relative}.videoWrap{height:290px;flex:none}.right{min-height:420px}.panel{max-height:none;overflow:visible}.timing{grid-template-columns:1fr 1fr}.nav input{width:110px}.media{position:sticky;top:0;z-index:3}h1{font-size:20px}.groups button{font-size:12px}}
body{height:100dvh;display:flex;flex-direction:column}header,.topbar{flex-shrink:0}.workspace{flex:1;min-height:0;height:auto}@media(max-width:800px){body{height:auto}.workspace{flex:none}}
</style></head><body>
<header><h1>发声标签 · 时间调整复核</h1><p>同一批100条 ｜ 原文保持不变 ｜ 官方词／单次VAD优先，无法对应时保留模型区间与音频保留范围的交集</p></header>
<div class="topbar"><div class="row groups"><button id="has" class="active"></button><button id="none"></button><span class="muted" id="aggregate"></span></div><div class="row nav"><button id="prev">上一条</button><select id="samples" aria-label="选择样本"></select><button id="next">下一条</button><input id="search" placeholder="搜索样本 ID" aria-label="搜索样本"><button id="export">导出反馈</button><a href="summary.csv" download>统计</a></div></div>
<main class="workspace"><section class="left"><div class="row"><span id="groupBadge" class="badge"></span><span id="gateBadge" class="badge gray"></span><span id="duration" class="small"></span></div><h2 id="title"></h2><div id="sid" class="sid"></div><div class="videoWrap"><video id="video" muted playsinline preload="metadata"></video></div><div class="row"><button id="play">播放／暂停</button><button id="restart">从头播放</button><button id="whole">取消区间限播</button></div><div id="meta" class="meta small"></div><div class="row small"><a id="labelDownload" download>下载本条新标签</a><a id="audioDownload" download>处理后音频</a><a href="../audio_official_gate100/">上一版静音试听</a></div><div id="status" class="error" role="status"></div></section>
<section class="right"><div class="media"><div class="row"><b class="small">试听音轨</b><button id="processed" class="active">处理后</button><button id="listener">原音</button><button id="removed">被移除部分</button><button id="speaker">speaker参考</button></div><audio id="audio" controls preload="metadata"></audio><div class="row playback"><span id="currentAudio"></span><span id="range">整段播放</span></div></div><div class="row tabs"><button id="tab-kept" class="active">剩余发声标注</button><button id="tab-excluded">已移出标注</button><button id="tab-visual">视觉标注</button><button id="tab-official">官方时间对照</button></div><div id="panel" class="panel"></div></section></main>
<script>
const $=x=>document.getElementById(x),audio=$('audio'),video=$('video'),f=x=>Number(x).toFixed(3),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA,C,idx=0,group='has_audio_labels',tab='kept',role='processed',stopAt=null,generation=0;
const STORAGE='official-aligned100-feedback-v1';let reviews={};try{reviews=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){}
const methods={official_words:'采用官方词时间',official_vad:'采用单次 VAD 时间',model_intersection:'模型时间 ∩ 保留范围',excluded:'已移出发声标注'};
const reasons={unique_literal_words_with_close_boundaries:'原文词一致，前后边界差均不超过0.2秒，且对应唯一。',isolated_nonlexical_event_single_vad_no_words:'单独的非语言发声与一段VAD对应；该段无官方词、无其他模型事件。',no_unique_literal_word_match:'没有唯一且足够接近的同词对应；保留我们的原文，使用时间交集。',multiple_matching_word_occurrences:'附近存在多次同词，无法唯一对应；保留原事件划分。',official_word_claimed_by_multiple_events:'多个事件竞争同一次官方词，不把它们强行合成一次。',word_assignment_would_reverse_event_order:'采用官方词会颠倒原事件顺序，因此使用交集。',vad_shared_with_other_events_or_words_or_insufficient_overlap:'VAD包含其他事件／词，或对应程度不足，不把它当成单次事件边界。',multiple_vad_regions_preserve_event_internal_boundaries:'涉及多段VAD，保留事件内部的有效子区间。',outside_official_audio_gate:'原事件完全在已确认的音频保留范围外。'};
function visible(){const q=$('search').value.toLowerCase();return DATA.cases.map((c,i)=>({c,i})).filter(({c})=>c.label_group===group&&(!q||c.sample_id.toLowerCase().includes(q)||String(c.sample_rank)===q)).map(x=>x.i)}
function list(){const ids=visible();$('samples').replaceChildren();for(const i of ids){const c=DATA.cases[i],o=document.createElement('option');o.value=i;o.textContent=`${c.short_id} · 剩 ${c.aligned_audio_events.length} 条发声标注`;o.selected=i===idx;$('samples').append(o)}if(!ids.length){const o=document.createElement('option');o.textContent='该组没有匹配样本';$('samples').append(o)}$('prev').disabled=!ids.some(i=>i<idx);$('next').disabled=!ids.some(i=>i>idx)}
function setGroup(g){group=g;$('has').classList.toggle('active',g==='has_audio_labels');$('none').classList.toggle('active',g==='no_audio_labels');$('search').value='';const ids=visible();list();if(ids.length)select(ids[0]);}
function safePlay(){audio.play().catch(e=>$('status').textContent=e.message)}
function switchRole(r){const t=audio.currentTime||0,playing=!audio.paused;audio.pause();video.pause();role=r;const token=++generation;audio.onloadedmetadata=()=>{if(token!==generation)return;audio.currentTime=Math.min(t,audio.duration);if(video.readyState>=1)video.currentTime=audio.currentTime;if(playing)safePlay()};audio.src=C.media[r];for(const k of ['processed','listener','removed','speaker'])$(k).classList.toggle('active',k===r);$('currentAudio').textContent={processed:C.gate.full_silence?'处理后：全段静音（非播放故障）':'处理后 listener',listener:'原始 listener',removed:'被移除部分（不等于纯噪声）',speaker:'speaker 参考'}[r];}
function playRange(a,b,pad=0){const start=Math.max(0,a-pad),end=Math.min(C.duration_s,b+pad);if(end<=start)return;audio.currentTime=start;stopAt=end;$('range').textContent=`限播 ${f(start)}–${f(end)} 秒`;safePlay()}
function listenButton(a,b,label){const btt=document.createElement('button');btt.textContent=label||`${f(a)}–${f(b)} 秒`;btt.onclick=()=>playRange(a,b);return btt}
function track(host,title,items,color){const row=document.createElement('div');row.className='track';const name=document.createElement('span');name.textContent=title;const lane=document.createElement('div');lane.className='lane';for(const x of items){const a=Math.max(0,x.start),b=Math.min(C.duration_s,x.end);if(b<=a)continue;const bar=document.createElement('button');bar.className='bar';bar.style.cssText=`left:${a/C.duration_s*100}%;width:${(b-a)/C.duration_s*100}%;background:${color}`;bar.title=`${f(a)}–${f(b)} ${x.description||x.text||''}`;bar.onclick=()=>playRange(a,b);lane.append(bar)}const cursor=document.createElement('i');cursor.className='cursor';lane.append(cursor);row.append(name,lane);host.append(row)}
function addFeedback(host){const div=document.createElement('div');div.className='feedback';div.innerHTML='<div class="row"><label>本条时间调整 <select id="decision"><option value="">未评价</option><option value="good">合理</option><option value="problem">有问题</option><option value="uncertain">不确定</option></select></label><span id="saved" class="small">自动保存到当前浏览器</span></div><textarea id="note" placeholder="可写事件 ID、时间与问题；原文差异可以保留。"></textarea>';host.append(div);const old=reviews[C.sample_id]||{};$('decision').value=old.decision||'';$('note').value=old.note||'';const save=()=>{reviews[C.sample_id]={sample_id:C.sample_id,decision:$('decision').value,note:$('note').value,updated_at:new Date().toISOString(),training_applied:false};localStorage.setItem(STORAGE,JSON.stringify(reviews));$('saved').textContent='已保存'};$('decision').onchange=save;$('note').oninput=save;}
function audioCard(a){const div=document.createElement('div');div.className='card '+(a.method==='excluded'?'excluded':a.boundary_changed?'changed':'');div.innerHTML=`<div class="row"><span class="badge ${a.method==='excluded'?'gray':a.method==='model_intersection'?'warn':''}">${esc(methods[a.method])}</span><span class="small">${esc(a.event_id)}</span></div><div class="description">${esc(a.description)}</div><div class="timing"><div class="old"><b>调整前 · 模型时间</b></div><div class="new"><b>调整后 · 标签时间</b></div></div><div class="evidence">${esc(reasons[a.reason]||a.reason)}</div>`;div.querySelector('.old').append(listenButton(a.source_interval.start,a.source_interval.end));const target=div.querySelector('.new');if(!a.intervals.length)target.append(document.createTextNode('无发声标签'));else for(const x of a.intervals)target.append(listenButton(x.start,x.end));if(a.intervals.length>1){const p=document.createElement('p');p.className='small';p.textContent='同一事件的多个有效子区间，不计为多次发声。';target.append(p)}
 if(a.official_evidence.length){const p=document.createElement('p');p.className='evidence';p.textContent='采用依据：'+a.official_evidence.map(w=>`${w.text||'VAD'} [${f(w.start)}, ${f(w.end)}]`).join(' · ');div.append(p)}
 if(a.text_not_literal_match){const p=document.createElement('p');p.className='notice';p.textContent='官方同期词：'+a.overlapping_official_words.map(w=>w.text).join(' ')+'。未确认逐字对应；上方保留我们的原文，没有替换为官方转写。';div.append(p)}
 const context=listenButton(a.source_interval.start,a.source_interval.end,'听前后文');context.onclick=()=>playRange(a.source_interval.start,a.source_interval.end,.4);div.append(context);const details=document.createElement('details');details.innerHTML='<summary>查看时间调整记录 JSON</summary>';const pre=document.createElement('pre');pre.textContent=JSON.stringify(a,null,2);details.append(pre);div.append(details);return div;}
function renderPanel(){const host=$('panel');host.replaceChildren();host.scrollTop=0;for(const k of ['kept','excluded','visual','official'])$('tab-'+k).classList.toggle('active',k===tab);
 if(tab==='kept'||tab==='excluded'){if(tab==='kept'){const t=document.createElement('div');t.className='timeline';track(t,'原模型事件',C.ours_audio_events,'#7396b2');track(t,'调整后标签',C.aligned_audio_events.flatMap(e=>e.intervals.map(x=>({...x,description:e.description}))),'#248379');track(t,'音频保留区',C.gate.intervals,'#b5c5d1');host.append(t)}const rows=C.alignment_audit.filter(a=>tab==='excluded'?a.method==='excluded':a.method!=='excluded');if(!rows.length){const div=document.createElement('div');div.className='empty';div.innerHTML=tab==='kept'?`<h3>本条没有剩余发声标注</h3>${C.gate.full_silence?'官方三类区间为空，处理后音频全静音。':'音频仍有官方保留区间，但没有可保留的原模型音频事件；本轮不自动补写新事件。'}<p>视觉反应仍保留，可切换“视觉标注”查看。</p>`:'没有被移出的发声标注。';host.append(div)}for(const a of rows)host.append(audioCard(a));addFeedback(host);}
 else if(tab==='visual'){if(!C.ours_other_events.length)host.innerHTML='<div class="empty">本条没有视觉标注。</div>';for(const e of C.ours_other_events){const div=document.createElement('div');div.className='card';div.innerHTML=`<span class="badge gray">视觉 · 时间与原文不变</span><div class="description">${esc(e.description)}</div><span class="small">${esc(e.event_id)} </span>`;div.append(listenButton(e.start,e.end));host.append(div)}}
 else{const tip=document.createElement('div');tip.className='notice';tip.textContent='这些是时间参考。词不一致时仍保留我们的描述；句级范围用于保护音频，不直接作为每个短回应的边界。';host.append(tip);for(const who of ['listener','speaker'])for(const [kind,title]of [['words','词'],['sentences','句'],['vad','VAD']]){const div=document.createElement('div');div.className='official';div.innerHTML=`<h3>官方 ${who} · ${title}</h3>`;const xs=C.official[who][kind].filter(x=>x.in_clip);if(!xs.length)div.append(document.createTextNode('片段内无记录'));for(const x of xs){const row=document.createElement('div');row.append(listenButton(x.start,x.end));row.append(document.createTextNode(' '+(x.text||'发声活动')));div.append(row)}host.append(div)}}}
function select(i){audio.pause();video.pause();C=DATA.cases[i];idx=i;stopAt=null;tab='kept';$('range').textContent='整段播放';$('status').textContent='';video.src=C.media.video;video.poster=C.media.poster;audio.currentTime=0;switchRole('processed');$('title').textContent=C.short_id;$('sid').textContent=C.sample_id;$('groupBadge').textContent=C.label_group==='has_audio_labels'?`剩余 ${C.aligned_audio_events.length} 条发声标注`:'没有剩余发声标注';$('groupBadge').className='badge '+(C.label_group==='has_audio_labels'?'':'gray');$('gateBadge').textContent=C.gate.full_silence?'音频全静音':'音频有保留区间';$('duration').textContent=f(C.duration_s)+' 秒';$('meta').textContent=`原音频事件 ${C.ours_audio_events.length} → 剩余 ${C.aligned_audio_events.length}；视觉事件 ${C.ours_other_events.length} 条保留。原轨起点 ${f(C.clip_absolute_start)} 秒。`;$('tab-kept').textContent=`剩余发声标注 ${C.aligned_audio_events.length}`;$('tab-excluded').textContent=`已移出 ${C.alignment_counts.excluded||0}`;$('tab-visual').textContent=`视觉 ${C.ours_other_events.length}`;$('labelDownload').href=C.aligned_label_url;$('audioDownload').href=C.media.processed;list();renderPanel();}
for(const k of ['processed','listener','removed','speaker'])$(k).onclick=()=>switchRole(k);for(const k of ['kept','excluded','visual','official'])$('tab-'+k).onclick=()=>{tab=k;renderPanel()};$('has').onclick=()=>setGroup('has_audio_labels');$('none').onclick=()=>setGroup('no_audio_labels');$('samples').onchange=()=>select(+$('samples').value);$('search').oninput=list;$('prev').onclick=()=>{const ids=visible().filter(i=>i<idx);if(ids.length)select(ids.at(-1))};$('next').onclick=()=>{const n=visible().find(i=>i>idx);if(n!==undefined)select(n)};$('play').onclick=()=>audio.paused?safePlay():audio.pause();$('restart').onclick=()=>{stopAt=null;audio.currentTime=0;$('range').textContent='整段播放';safePlay()};$('whole').onclick=()=>{stopAt=null;$('range').textContent='整段播放'};
audio.addEventListener('play',()=>{if(video.readyState>=1)video.currentTime=audio.currentTime;video.play().catch(()=>{})});audio.addEventListener('pause',()=>video.pause());audio.addEventListener('seeking',()=>{if(video.readyState>=1)video.currentTime=audio.currentTime});audio.addEventListener('error',()=>{$('status').textContent='音频加载失败，请检查 Cursor 转发连接。'});
function tick(){if(C){if(!audio.paused){if(stopAt!==null&&audio.currentTime>=stopAt)audio.pause();else if(video.readyState>=2&&Math.abs(video.currentTime-audio.currentTime)>.12)video.currentTime=audio.currentTime;}document.querySelectorAll('.cursor').forEach(x=>x.style.left=((audio.currentTime||0)/C.duration_s*100)+'%')}requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('export').onclick=()=>{const out={schema:'official-aligned100-feedback-v1',run_id:DATA.run_id,exported_at:new Date().toISOString(),training_applied:false,records:Object.values(reviews)};const u=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='official-aligned100-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
fetch('review.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{DATA=d;const s=d.alignment_summary;$('has').textContent=`仍剩余发声标注 · ${s.with_audio_labels} 条`;$('none').textContent=`没有发声标注 · ${s.without_audio_labels} 条`;$('aggregate').textContent=`${s.original_audio_events} → ${s.retained_audio_events} 个音频事件 ｜ 原文不改写 ｜ 尚未替换训练数据`;setGroup('has_audio_labels')}).catch(e=>$('status').textContent='加载失败：'+e.message);
</script></body></html>
