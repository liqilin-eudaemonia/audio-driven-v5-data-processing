audionet:
  audionet_config:
    enc_kernel_size: 1
    in_channels: 512
    num_blocks: 16
    num_sources: 1
    out_channels: 128
    upsampling_depth: 5
    vin_channels: 64
    vout_channels: 64
    vpre_channels: 512
  audionet_name: IIANet
datamodule:
  data_config:
    batch_size: 3
    n_src: 1
    normalize_audio: false
    num_workers: 8
    persistent_workers: false
    pin_memory: true
    sample_rate: 16000
    segment: 2.0
    test_dir: DataPreProcess/Vox2/tt
    train_dir: DataPreProcess/Vox2/tr
    valid_dir: DataPreProcess/Vox2/cv
  data_name: AVSpeechDyanmicDataModule
exp:
  exp_name: Vox2-IIANet
loss:
  train:
    config:
      pit_from: pw_mtx
      threshold_byloss: false
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_snr
  val:
    config:
      pit_from: pw_mtx
      threshold_byloss: false
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr
main_args:
  conf_dir: configs/Vox2-IIANet.yml
  exp_dir: checkpoints/vox2
  help: null
optimizer:
  lr: 0.001
  optim_name: adam
  weight_decay: 0.0
positional arguments: {}
scheduler:
  sche_config:
    factor: 0.5
    patience: 10
  sche_name: ReduceLROnPlateau
training:
  early_stop:
    mode: min
    monitor: val_loss/dataloader_idx_0
    patience: 20
    verbose: true
  epochs: 500
  gpus:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  parallel: ddp
  system: AudioVisualLightningModule
videonet:
  videonet_config:
    pretrain: pretrain_zoo/lrw_resnet18_mstcn_adamw_s3.pth.tar
  videonet_name: ResNetVideoModel
