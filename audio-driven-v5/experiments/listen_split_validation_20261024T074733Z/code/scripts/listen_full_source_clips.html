<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>两条长视频 · 逐段切分审核</title>
<style>
@font-face{font-family:Review;src:url(review.woff)}*{box-sizing:border-box}body{margin:0;background:#0d1524;color:#e8effa;font:15px Review,system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 10px}p{color:#aebed5;line-height:1.7}a{color:#88c5ff}button,select,textarea{font:inherit;background:#1c2b43;border:1px solid #415775;color:inherit;padding:8px;border-radius:7px;max-width:100%}button{cursor:pointer}button:hover{background:#2a4263}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:13px 0}.layout{display:grid;grid-template-columns:340px 1fr;gap:20px}.sidebar{max-height:820px;overflow:auto;background:#142036;border:1px solid #304563;border-radius:10px;padding:8px}.sidebar button{display:block;width:100%;text-align:left;margin:4px 0;line-height:1.5}.sidebar .selected{border:2px solid #7bbaff;background:#253c59}.keep{color:#66d8ab}.hold{color:#ffba75}video{width:100%;aspect-ratio:3/1;background:black}.panel{background:#132138;border:1px solid #304563;border-radius:10px;padding:15px;min-width:0}#title,#detail{overflow-wrap:anywhere;line-height:1.7}#note{width:100%;height:90px}.muted{color:#9baec9;font-size:13px}.badge{padding:4px 8px;border-radius:4px;background:#233955}#error{color:#ff9999;white-space:pre-wrap}#text{line-height:1.8}#downloads{display:flex;flex-wrap:wrap;gap:12px}#list small{color:#a6b9d5}@media(max-width:800px){main{padding:12px}.layout{display:flex;flex-direction:column-reverse}.sidebar{max-height:360px}.controls{gap:7px}}
</style>
<main><h1>两条长视频 · 逐段切分审核</h1>
<p>默认播放切分起点前 3 秒至终点后 3 秒，连续听过两处边界。黄色竖线标出起点和终点，绿色范围才是原切片；灰色范围仅为上下文，未纳入该片段。源视频开头或结尾不足 3 秒时显示实际长度。</p>
<div class="controls"><select id="group" aria-label="原视频"></select><select id="filter" aria-label="筛选状态"><option value="all">全部切分候选</option><option value="keep">音质通过</option><option value="withheld">未通过 / 待复核</option></select><a id="zip" download>下载本组上下文视频 ZIP</a><a id="originalZip" download>原切片 ZIP</a><a href="/listen_full_source/" target="_blank">返回完整原视频审核</a></div>
<p id="summary"></p>
<div class="layout"><aside class="sidebar" id="list"></aside><section class="panel">
<strong id="title"></strong><p id="detail"></p>
<video id="video" controls playsinline preload="metadata"></video>
<canvas id="boundaryTimeline" width="1000" height="75" style="width:100%;height:75px;display:block;cursor:crosshair" aria-label="切分起止边界与前后上下文"></canvas>
<div id="contextStatus" style="line-height:1.7;color:#ffd38a"></div>
<p id="contextInfo" class="muted"></p>
<div class="controls"><button id="prev">上一段</button><button id="next">下一段</button><button id="replay">从头播放</button>
<select id="view" aria-label="播放范围"><option value="context">前后各 3 秒上下文</option><option value="clip">仅原切片</option></select>
<select id="channel" aria-label="试听音轨"><option value="both">双方音轨（左耳 speaker / 右耳 listener）</option><option value="speaker">只听 speaker</option><option value="listener">只听 listener</option></select>
<label><input type="checkbox" id="auto">播完自动下一段</label></div>
<div class="controls"><button id="checkStart">查看起点前 3 秒</button><button id="checkEnd">查看终点前 3 秒</button></div>
<div id="downloads"></div><p id="text"></p><p class="muted" id="reason"></p>
<p class="muted">回收子片段与被拒绝的父候选可能重叠，两者分别标注，不能重复计入可用时长。</p>
<div class="controls"><select id="decision" aria-label="审核结论"><option value="pending">待检查</option><option value="keep">可以保留</option><option value="reject">应该筛掉</option><option value="boundary">切分边界有问题</option><option value="role">角色 / 内容有问题</option></select><button id="save">保存本段反馈</button><button id="export">导出全部反馈</button><span id="saved" class="muted"></span></div>
<textarea id="note" placeholder="记录本段的问题，例如开头切得太急、listener 串音、反应不是 backchannel"></textarea>
</section></div><div id="error"></div></main>
<script>
const $=s=>document.querySelector(s),v=$('#video');let data=null,rows=[],current=null,mediaStart=0,loadToken=0;const key='listen-full-source-clips-notes',notes=JSON.parse(localStorage.getItem(key)||'{}');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toFixed(3).padStart(6,'0')}`;
const label=r=>r.pool==='keep_candidate'?'音质通过':r.pool==='audio_review'?'音质待复核':r.pool==='audio_reject'?'音质排除':'暂不保留';
const reasons={passed_severity_trial:'按当前音质标准通过，等待本次人工验收',environmental_prediction_unresolved:'环境声证据待复核',intrusive_transient_noise:'明显瞬态噪声',local_match_unresolved:'局部串音证据待复核',high_listener_background_floor:'listener 底噪偏高'};
function loadMedia(sourceTime=null,play=false){const token=++loadToken,useContext=$('#view').value==='context'&&!!current.context;mediaStart=useContext?current.context.start:current.start;const duration=useContext?current.context.duration_s:current.duration_s;v.src=current.preview+(useContext?'context_':'')+$('#channel').value+'.mp4';const t=sourceTime===null?0:Math.max(0,Math.min(duration-.01,sourceTime-mediaStart));v.addEventListener('loadedmetadata',()=>{if(token!==loadToken)return;v.currentTime=t;if(play)v.play().catch(e=>$('#error').textContent=e);drawBoundary()},{once:true});drawBoundary()}
function drawBoundary(){if(!current)return;const useContext=$('#view').value==='context'&&!!current.context,c=current.context,a=useContext?c.cut_start_offset:0,b=useContext?c.cut_end_offset:current.duration_s,d=useContext?c.duration_s:current.duration_s,t=v.currentTime,sourceTime=mediaStart+t;
const g=$('#boundaryTimeline').getContext('2d'),left=24,width=952,x0=left+width*a/d,x1=left+width*b/d;g.clearRect(0,0,1000,75);g.fillStyle='#53657e';g.fillRect(left,32,width,17);g.fillStyle='#35ba84';g.fillRect(x0,32,x1-x0,17);g.fillStyle='#ffe08c';g.fillRect(x0,24,3,33);g.fillRect(x1-2,24,3,33);g.font='15px Review,sans-serif';g.textAlign='center';g.fillText('起点 '+fmt(current.start),Math.max(92,x0),18);g.fillText('终点 '+fmt(current.end),Math.min(908,x1),18);g.fillStyle='white';g.fillRect(left+width*Math.min(t,d)/d,27,2,28);g.textAlign='left';g.fillStyle='#9eafc8';g.fillText(fmt(mediaStart),left,72);g.textAlign='right';g.fillText(fmt(mediaStart+d),976,72);
let stage=sourceTime<current.start?'切分前上下文':sourceTime<current.end?'切分范围内':'切分后上下文';$('#contextStatus').textContent=`${stage} · 原视频时间 ${fmt(sourceTime)} · 切入 ${fmt(current.start)} / 切出 ${fmt(current.end)}`;$('#contextInfo').textContent=useContext?`实际前文 ${c.before_seconds.toFixed(3)} 秒，后文 ${c.after_seconds.toFixed(3)} 秒${c.before_seconds<2.999?'（前文已到源视频开头）':''}${c.after_seconds<2.999?'（后文已到源视频结尾）':''}。角色和音轨名称按待审片段固定，前后文可能换说话人；上下文音质不代表片段内音质。`:'当前只播放原切片；切点和筛选结论均未改变。'}
function choose(row){if(!row)return;current=row;window.currentClip=row;loadMedia();$('#title').textContent=`第 ${data.groups.findIndex(g=>g.pair===row.pair)+1} 组 · 第 ${row.ordinal} 段 · ${row.sample_id}`;$('#detail').innerHTML=`<span class="badge ${row.pool==='keep_candidate'?'keep':'hold'}">${label(row)}</span>　原视频 ${fmt(row.start)} → ${fmt(row.end)}　原切片 ${row.duration_s.toFixed(3)} 秒<br>speaker：${row.speaker_index?'B':'A'} ／ listener：${row.listener_index?'B':'A'}　${row.recovery_complete_sentence?'句界候选':'句内切分，请检查自然度'}${row.recovery_depth?`　<span class="badge">局部回收子片段 · 第 ${row.recovery_depth} 层</span>`:''}`;
$('#text').textContent=row.text||'';$('#reason').textContent=(row.reasons||[]).map(r=>reasons[r]||r).join('；')+(row.recovery_parent_id?'；父候选：'+row.recovery_parent_id:'');$('#downloads').innerHTML=[['context_both.mp4','下载带边界的上下文视频'],['context_speaker.mp4','上下文 · speaker'],['context_listener.mp4','上下文 · listener'],['both.mp4','下载原切片'],['speaker.wav','原 speaker WAV'],['listener.wav','原 listener WAV']].map(([file,text])=>`<a href="${row.preview+file}" download="${row.ordinal}_${row.sample_id}_${file}">${text}</a>`).join('');const n=notes[row.sample_id];$('#decision').value=n?.decision||'pending';$('#note').value=n?.note||'';$('#saved').textContent='';$('#list').querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.id===row.sample_id));$('#prev').disabled=rows.indexOf(row)===0;$('#next').disabled=rows.indexOf(row)===rows.length-1}
function list(){const pair=$('#group').value,filter=$('#filter').value;rows=data.clips.filter(r=>r.pair===pair&&(filter==='all'||(r.pool==='keep_candidate')===(filter==='keep')));const g=data.groups.find(g=>g.pair===pair);$('#zip').href=g.context_zip;$('#originalZip').href=g.zip;$('#summary').textContent=`原视频 ${g.summary.source_seconds} 秒 · ${g.total} 个候选（含回收子片段）· 音质通过 ${g.summary.final_kept_clips} 段 / ${g.summary.new_kept_seconds.toFixed(1)} 秒 · 当前显示 ${rows.length} 段`;
$('#list').innerHTML=rows.map(r=>`<button data-id="${esc(r.sample_id)}"><strong>${r.ordinal}. ${fmt(r.start)}–${fmt(r.end)}</strong><br><span class="${r.pool==='keep_candidate'?'keep':'hold'}">${label(r)}</span> · ${r.duration_s.toFixed(2)} 秒 ${r.recovery_depth?'· 回收子片段':''}<br><small>${esc((r.text||'').slice(0,82))}</small></button>`).join('');$('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(rows.find(r=>r.sample_id===b.dataset.id)));choose(rows[0])}
function step(delta,play=false){const row=rows[rows.indexOf(current)+delta];if(!row)return;choose(row);if(play)v.play().catch(e=>$('#error').textContent=e)}
$('#group').onchange=list;$('#filter').onchange=list;$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#replay').onclick=()=>{v.currentTime=0;v.play()};v.onended=()=>{if($('#auto').checked)step(1,true)};
$('#channel').onchange=$('#view').onchange=()=>{if(!current)return;loadMedia(mediaStart+v.currentTime,!v.paused)};
function focusBoundary(edge){if(!current)return;if(!current.context){$('#contextStatus').textContent='上下文仍在生成，请稍后刷新';return;}$('#view').value='context';loadMedia(current[edge]-3,true)}
$('#checkStart').onclick=()=>focusBoundary('start');$('#checkEnd').onclick=()=>focusBoundary('end');
v.ontimeupdate=v.onseeked=drawBoundary;$('#boundaryTimeline').onclick=e=>{const box=e.currentTarget.getBoundingClientRect(),x=(e.clientX-box.left)*1000/box.width,d=$('#view').value==='context'?current.context.duration_s:current.duration_s;v.currentTime=Math.max(0,Math.min(d-.01,(x-24)/952*d))};
$('#save').onclick=()=>{notes[current.sample_id]={pair:current.pair,ordinal:current.ordinal,start:current.start,end:current.end,decision:$('#decision').value,note:$('#note').value,utc:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(notes));$('#saved').textContent='已保存'};
$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({input_sha256:data.input_sha256,notes},null,2)],{type:'application/json'}));a.download='split-clips-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
v.onerror=()=>$('#error').textContent=v.error?.message||'视频加载失败';
async function start(){const response=await fetch('clips.json',{cache:'no-store'});if(!response.ok)throw Error('无法读取片段清单');data=await response.json();window.clipData=data;$('#group').innerHTML=data.groups.map((g,i)=>`<option value="${g.pair}">${i+1}. ${esc(g.pair)}</option>`).join('');list()}start().catch(e=>$('#error').textContent=e);
</script></html>
