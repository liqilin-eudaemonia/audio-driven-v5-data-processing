const attitudeText = { positive: "积极 positive", neutral: "中性 neutral", negative: "消极 negative" };
const summary = document.getElementById("summary");
const counts = clips.reduce((m, c) => (m[c.attitude] = (m[c.attitude] || 0) + 1, m), {});
const seconds = clips.reduce((s, c) => s + c.duration, 0);
summary.textContent = `43 条，合计 ${seconds.toFixed(1)} 秒。积极 ${counts.positive || 0}，中性 ${counts.neutral || 0}，消极 ${counts.negative || 0}。听者和说话人都是 512×512 裁脸。画面没有音轨，声音在下面单独的音频里。`;
const list = document.getElementById("list");
const listener = document.getElementById("listener");
const speaker = document.getElementById("speaker");
const audio = document.getElementById("audio");
const now = document.getElementById("now");
let index = 0;
clips.forEach((c, i) => {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.className = "row";
  b.type = "button";
  b.innerHTML = `<div>${c.n}. ${c.uuid}</div><div class="meta">${attitudeText[c.attitude] || c.attitude} · ${c.duration.toFixed(1)} 秒 · 512×512 · 原框 ${c.native_side}</div>`;
  b.addEventListener("click", () => show(i));
  li.appendChild(b);
  list.appendChild(li);
});
function show(i) {
  index = (i + clips.length) % clips.length;
  const c = clips[index];
  listener.src = c.listener;
  speaker.src = c.speaker;
  audio.src = c.audio;
  listener.pause(); speaker.pause(); audio.pause();
  now.textContent = `${c.n} / 43 · 听者 ${c.listener_id} · 说话人 ${c.speaker_id} · ${attitudeText[c.attitude] || c.attitude}`;
  [...list.querySelectorAll("button")].forEach((b, n) => {
    if (n === index) b.setAttribute("aria-current", "true");
    else b.removeAttribute("aria-current");
  });
  list.children[index].scrollIntoView({ block: "nearest" });
}
document.getElementById("prev").addEventListener("click", () => show(index - 1));
document.getElementById("next").addEventListener("click", () => show(index + 1));
document.getElementById("play").addEventListener("click", async () => {
  listener.currentTime = 0; speaker.currentTime = 0; audio.currentTime = 0;
  await Promise.all([listener.play(), speaker.play(), audio.play()]);
});
show(0);
