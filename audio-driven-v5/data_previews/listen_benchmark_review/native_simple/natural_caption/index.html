<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omni · 净化音轨自然语言描述</title>
<style>@font-face{font-family:Review;src:url(review.woff)}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17243b;font:15px/1.7 system-ui,Review,sans-serif}main{max-width:1450px;margin:auto;padding:24px}h1{font-size:25px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}p{margin:8px 0}.muted{color:#617087;font-size:13px}.panel{background:#fff;border:1px solid #dde3eb;border-radius:12px;padding:20px;margin-top:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #cad3e0;background:white;border-radius:7px;padding:7px 10px;color:inherit}button{cursor:pointer}select{max-width:100%}a{color:#315fc3}.layout{display:grid;grid-template-columns:minmax(330px,43%) minmax(0,1fr);gap:20px;align-items:start}.left{position:sticky;top:14px}video{width:100%;max-height:510px;background:#111;border-radius:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 monospace}#caption{font-size:18px;line-height:1.85;white-space:pre-wrap}#sampleId{overflow-wrap:anywhere}.flag{color:#935111;background:#fff6df;border-radius:6px;padding:7px 10px}textarea{width:100%;min-height:76px;font:inherit;border:1px solid #cad3e0;border-radius:7px;padding:9px}.check{display:block;margin:7px 0}@media(max-width:850px){.layout{grid-template-columns:1fr}.left{position:static}main{padding:12px}}</style>
<main><a href="../">← 历史逐事件打标页面</a><h1>净化 listener 音轨＋视频 → 整段自然语言描述</h1>
<p class="muted">Qwen3-Omni · 原生视频 8 fps · 512×512 listener 裁剪 · 只输入净化后的 listener 音频。没有喂入旧标注或官方转写文本。英文段落为模型原始输出，尚未人工验收。</p>
<div class="panel"><div id="summary">加载中…</div><div class="row"><button id="prev">上一条</button><select id="sample"></select><button id="next">下一条</button><select id="filter"><option value="all">全部样本</option><option value="audible">净化后仍有声音</option><option value="silent">净化后全静音</option><option value="flags">需注意的输出</option></select><a href="review.json" download>下载全部结果 JSON</a></div></div>
<div class="layout"><section class="panel left"><h2 id="sampleId"></h2><video id="video" controls muted playsinline></video><audio id="listenerAudio" preload="auto"></audio><audio id="speakerAudio" preload="auto"></audio>
<div class="row"><button id="soundPlay">有声播放／暂停</button><select id="audioMode"><option value="processed">净化 listener（模型实际输入）</option><option value="original">原始 listener（复核参考）</option><option value="dialogue">原始双人音轨（复核参考）</option><option value="silent">静音看动作</option></select></div>
<div class="row"><label>音量 <input id="audioVolume" type="range" min="0" max="1" step=".05" value="1"></label><label>速度 <select id="speed"><option value="1">1×</option><option value=".5">0.5×</option><option value=".75">0.75×</option></select></label></div><p id="audioStatus" class="muted"></p><p id="mediaNote" class="muted"></p></section>
<section><div class="panel"><h2>整段自然语言描述</h2><div id="caption"></div><p id="flags" class="flag" hidden></p><p id="resultMeta" class="muted"></p><button id="copy">复制英文描述</button></div>
<div class="panel"><h2>重点复核</h2><p id="focus" class="flag" hidden></p><p>看完整段并听净化音轨，检查以下问题。标记仅用于反馈，不会自动改写输出。</p><label class="check"><input type="checkbox" data-issue="missing_action"> 漏掉真实动作（尤其点头、短暂表情）</label><label class="check"><input type="checkbox" data-issue="wrong_order_or_overlap"> 动作顺序或同时发生关系不对</label><label class="check"><input type="checkbox" data-issue="false_repetition"> 把持续状态写成反复动作，或次数不对</label><label class="check"><input type="checkbox" data-issue="wrong_audio"> 凭空写出声音、错词，或漏掉真实发声</label><label class="check"><input type="checkbox" data-issue="interpretation"> 仍有心理、意图或情绪推演</label><textarea id="note" placeholder="可填写大致时刻和问题，不必重新标注全部内容"></textarea><div class="row"><button id="good">本条描述基本可用</button><button id="export">导出人工复核</button><span id="saved" class="muted"></span></div></div>
<details class="panel"><summary>本轮完整 prompt</summary><pre id="prompt"></pre></details><details class="panel"><summary>历史原 prompt 逐事件结果（参考，不是真值）</summary><pre id="oldEvents"></pre><a id="oldLink">打开旧版完整结果</a></details></section></div></main>
<script src="audio.js"></script><script>
let data,visible=[],current;const $=id=>document.getElementById(id),key='listen-native-caption-review-20261030';let reviews=JSON.parse(localStorage.getItem(key)||'{}');
function persist(accepted){if(!current)return;reviews[current.id]={sample_id:current.id,issues:[...document.querySelectorAll('[data-issue]:checked')].map(x=>x.dataset.issue),note:$('note').value,accepted:accepted??false,human_ground_truth:false,updated_at:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(reviews));$('saved').textContent='已保存在当前浏览器';}
async function show(id){current=data.samples.find(s=>s.id===id);if(!current)return;const s=current;$('video').pause();$('video').muted=true;$('video').src=s.video;$('sample').value=id;$('sampleId').textContent=s.short+' · '+s.duration.toFixed(3)+' 秒';$('caption').textContent=s.result?.caption||'尚未完成';$('prompt').textContent=s.result?.prompt||data.protocol.prompt;$('flags').hidden=!s.result?.review_flags.length;$('flags').textContent='自动提示（需人工判断）：'+(s.result?.review_flags||[]).join('、');$('resultMeta').textContent=s.result?`${s.result.completion_tokens} tokens · 推理 ${s.result.seconds.toFixed(1)} 秒 · finish=${s.result.finish_reason}`:'';$('focus').hidden=!s.focus;$('focus').textContent=s.focus||'';$('oldEvents').textContent=JSON.stringify(s.historical_events,null,2);$('oldLink').href=s.historical_url;$('mediaNote').textContent=s.audio.processed_full_silence?'本段净化后全静音，视频动作仍完整保留。若描述出现发声，需要重点核对。':'本段净化后仍有 listener 声音；请核对回应原词、发声顺序及视听同时发生关系。';const r=reviews[id]||{};document.querySelectorAll('[data-issue]').forEach(x=>x.checked=(r.issues||[]).includes(x.dataset.issue));$('note').value=r.note||'';$('saved').textContent=r.accepted?'已标记：基本可用':r.updated_at?'已保存复核':'';history.replaceState(null,'','?sample='+encodeURIComponent(id));await window.reviewAudioLoad(s);}
function rebuild(){const f=$('filter').value;visible=data.samples.filter(s=>f==='all'||f==='silent'&&s.audio.processed_full_silence||f==='audible'&&!s.audio.processed_full_silence||f==='flags'&&s.result?.review_flags.length);$('sample').replaceChildren(...visible.map((s,i)=>{let o=document.createElement('option');o.value=s.id;o.textContent=`${i+1}/${visible.length} · ${s.short} · ${s.audio.processed_full_silence?'静音':'有声音'}`;return o}));if(visible.length)show(visible.some(s=>s.id===current?.id)?current.id:visible[0].id);}
$('sample').onchange=()=>show($('sample').value);$('filter').onchange=rebuild;for(const [id,delta]of[['prev',-1],['next',1]])$(id).onclick=()=>{const i=visible.findIndex(s=>s.id===current?.id);if(visible.length)show(visible[(i+delta+visible.length)%visible.length].id)};$('speed').onchange=()=>{$('video').playbackRate=+$('speed').value};$('note').oninput=()=>persist();document.querySelectorAll('[data-issue]').forEach(x=>x.onchange=()=>persist());$('good').onclick=()=>persist(true);$('copy').onclick=()=>navigator.clipboard.writeText(current.result?.caption||'');$('export').onclick=()=>{let blob=new Blob([JSON.stringify({schema:'listen-native-caption-human-review-v1',run_id:data.run_id,human_ground_truth:false,records:Object.values(reviews)},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='native-caption-human-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
fetch('review.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{data=d;const s=d.stats;$('summary').textContent=`完成 ${s.completed}/${s.samples} 条 · 净化后有声 ${s.samples-s.full_silence} 条／全静音 ${s.full_silence} 条 · 自然语言输出，不做净化效果消融对照`;const id=new URLSearchParams(location.search).get('sample');current=data.samples.find(s=>s.id===id);rebuild()}).catch(e=>{$('summary').textContent='加载失败：'+e.message});
</script></html>
