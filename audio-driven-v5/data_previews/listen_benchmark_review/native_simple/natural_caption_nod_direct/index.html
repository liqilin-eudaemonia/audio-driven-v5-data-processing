<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omni · 净化音轨自然语言描述</title>
<style>@font-face{font-family:Review;src:url(review.woff)}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17243b;font:15px/1.7 system-ui,Review,sans-serif}main{max-width:1450px;margin:auto;padding:24px}h1{font-size:25px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}p{margin:8px 0}.muted{color:#617087;font-size:13px}.panel{background:#fff;border:1px solid #dde3eb;border-radius:12px;padding:20px;margin-top:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #cad3e0;background:white;border-radius:7px;padding:7px 10px;color:inherit}button{cursor:pointer}select{max-width:100%}a{color:#315fc3}.layout{display:grid;grid-template-columns:minmax(330px,43%) minmax(0,1fr);gap:20px;align-items:start}.left{position:sticky;top:14px}video{width:100%;max-height:510px;background:#111;border-radius:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 monospace}#caption{font-size:18px;line-height:1.85;white-space:pre-wrap;max-height:600px;overflow:auto}#sampleId{overflow-wrap:anywhere}.flag{color:#935111;background:#fff6df;border-radius:6px;padding:7px 10px}textarea{width:100%;min-height:76px;font:inherit;border:1px solid #cad3e0;border-radius:7px;padding:9px}.check{display:block;margin:7px 0}@media(max-width:850px){.layout{grid-template-columns:1fr}.left{position:static}main{padding:12px}}</style>
<main><a href="../">← 历史逐事件打标页面</a><h1 id="pageTitle">净化 listener 音轨＋视频 → 整段自然语言描述</h1>
<p id="pageIntro" class="muted">Qwen3-Omni · 原生视频 8 fps · 512×512 listener 裁剪 · 只输入净化后的 listener 音频。没有喂入旧标注或官方转写文本。英文段落为模型原始输出，尚未人工验收。</p>
<div class="panel"><div id="summary">加载中…</div><div class="row"><button id="prev">上一条</button><select id="sample"></select><button id="next">下一条</button><select id="filter"><option value="all">全部样本</option><option value="audible">净化后仍有声音</option><option value="silent">净化后全静音</option><option value="flags">需注意的输出</option><option value="nod">有点头候选</option><option value="no_nod">没有点头候选</option><option value="nod_unchanged">有候选但原文未变</option></select><a href="review.json" download>下载全部结果 JSON</a></div></div>
<div class="layout"><section class="panel left"><h2 id="sampleId"></h2><video id="video" controls muted playsinline></video><audio id="listenerAudio" preload="auto"></audio><audio id="speakerAudio" preload="auto"></audio>
<div class="row"><button id="soundPlay">有声播放／暂停</button><select id="audioMode"><option value="processed">净化 listener（模型实际输入）</option><option value="original">原始 listener（复核参考）</option><option value="dialogue">原始双人音轨（复核参考）</option><option value="silent">静音看动作</option></select></div>
<div class="row"><label>音量 <input id="audioVolume" type="range" min="0" max="1" step=".05" value="1"></label><label>速度 <select id="speed"><option value="1">1×</option><option value=".5">0.5×</option><option value=".75">0.75×</option></select></label></div><p id="audioStatus" class="muted"></p><p id="mediaNote" class="muted"></p></section>
<section><div id="nodPanel" class="panel" hidden><h2>高召回点头时间线索</h2><p id="nodNote" class="muted"></p><div id="nodIntervals" class="row"></div></div><div class="panel"><h2 id="captionTitle">整段自然语言描述</h2><div id="caption"></div><p id="flags" class="flag" hidden></p><p id="resultMeta" class="muted"></p><button id="copy">复制英文描述</button></div>
<div id="priorPanel" class="panel" hidden><h2>补充前的整段描述</h2><p id="priorCaption" style="white-space:pre-wrap"></p></div><div class="panel"><h2>重点复核</h2><p id="focus" class="flag" hidden></p><p>看完整段并听净化音轨，检查以下问题。标记仅用于反馈，不会自动改写输出。</p><label class="check"><input type="checkbox" data-issue="missing_action"> 漏掉真实动作（尤其点头、短暂表情）</label><label class="check"><input type="checkbox" data-issue="wrong_order_or_overlap"> 动作顺序或同时发生关系不对</label><label class="check"><input type="checkbox" data-issue="false_repetition"> 把持续状态写成反复动作，或次数不对</label><label class="check"><input type="checkbox" data-issue="wrong_audio"> 凭空写出声音、错词，或漏掉真实发声</label><label class="check"><input type="checkbox" data-issue="interpretation"> 仍有心理、意图或情绪推演</label><textarea id="note" placeholder="可填写大致时刻和问题，不必重新标注全部内容"></textarea><div class="row"><button id="good">本条描述基本可用</button><button id="export">导出人工复核</button><span id="saved" class="muted"></span></div></div>
<details class="panel"><summary>本轮完整 prompt</summary><pre id="prompt"></pre></details><details class="panel"><summary>历史原 prompt 逐事件结果（参考，不是真值）</summary><pre id="oldEvents"></pre><a id="oldLink">打开旧版完整结果</a></details></section></div></main>
<script src="audio.js"></script><script>
let data,visible=[],current;const $=id=>document.getElementById(id),key='listen-native-caption-review-20261030:'+location.pathname;let reviews=JSON.parse(localStorage.getItem(key)||'{}');
const flagNames={generation_not_finished:'输出达到长度上限，文本未完成',empty_caption:'输出为空',possible_interpretation_review:'含可能的推演措辞',mental_state_wording_review:'含心理或意图解释性措辞',nod_cue_not_explicitly_named_review:'有点头线索，正文未明确命名点头',quoted_content_in_fully_silent_audio_review:'全静音输入中出现引号文本，请核对是否虚构发声',mentions_input_metadata_in_caption:'正文提到了输入元数据',verify_actual_nod_count_not_interval_count:'请核对实际次数，不能按区间数计次',nod_cues_caption_unchanged:'有点头候选，但旧段落未改变',numeric_timing_review:'正文含数字时间，请复核'};let nodStopAt=null;
$('video').addEventListener('timeupdate',()=>{if(nodStopAt!==null&&$('video').currentTime>=nodStopAt){$('video').pause();nodStopAt=null}});
function showNods(s){nodStopAt=null;$('nodPanel').hidden=!s.nod;$('priorPanel').hidden=typeof s.prior_caption!=='string';if(!s.nod)return;$('priorCaption').textContent=s.prior_caption||'';$('captionTitle').textContent=data.protocol.task==='nod_guided_direct_annotation'?'本轮独立打标的整段描述':s.nod.events.length?'融入点头后的整段描述':'没有点头候选：原描述保持不变';$('nodNote').textContent=s.nod.events.length?'25 fps GLARE recall 候选；区间数不是单次点头次数，也不是人工真值。点击可播放附近画面。':'检测成功，但未检出点头候选；不把这一结果解释为确定没有点头。';$('nodIntervals').replaceChildren(...s.nod.events.map(e=>{let b=document.createElement('button');b.dataset.nodId=e.id;b.textContent=`${e.id} · ${e.start.toFixed(2)}–${e.end.toFixed(2)} 秒`;b.onclick=()=>{$('video').pause();$('video').currentTime=Math.max(0,e.start-.25);nodStopAt=Math.min(s.duration,e.end+.25);$('video').play()};return b}));}
function persist(accepted){if(!current)return;reviews[current.id]={sample_id:current.id,issues:[...document.querySelectorAll('[data-issue]:checked')].map(x=>x.dataset.issue),note:$('note').value,accepted:accepted??false,human_ground_truth:false,updated_at:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(reviews));$('saved').textContent='已保存在当前浏览器';}
async function show(id){current=data.samples.find(s=>s.id===id);if(!current)return;const s=current;$('video').pause();$('video').muted=true;$('video').src=s.video;$('sample').value=id;showNods(s);$('sampleId').textContent=s.short+' · '+s.duration.toFixed(3)+' 秒';$('caption').textContent=s.result?.caption||'尚未完成';$('prompt').textContent=s.result?.prompt||data.protocol.prompt;$('flags').hidden=!s.result?.review_flags.length;$('flags').textContent='自动提示（需人工判断）：'+(s.result?.review_flags||[]).map(x=>flagNames[x]||x).join('；');$('resultMeta').textContent=s.result?`${s.result.completion_tokens} tokens · 推理 ${s.result.seconds.toFixed(1)} 秒 · finish=${s.result.finish_reason}`:'';$('focus').hidden=!s.focus;$('focus').textContent=s.focus||'';$('oldEvents').textContent=JSON.stringify(s.historical_events,null,2);$('oldLink').href=s.historical_url;$('mediaNote').textContent=s.audio.processed_full_silence?'本段净化后全静音，视频动作仍完整保留。若描述出现发声，需要重点核对。':'本段净化后仍有 listener 声音；请核对回应原词、发声顺序及视听同时发生关系。';const r=reviews[id]||{};document.querySelectorAll('[data-issue]').forEach(x=>x.checked=(r.issues||[]).includes(x.dataset.issue));$('note').value=r.note||'';$('saved').textContent=r.accepted?'已标记：基本可用':r.updated_at?'已保存复核':'';history.replaceState(null,'','?sample='+encodeURIComponent(id));await window.reviewAudioLoad(s);}
function rebuild(){const f=$('filter').value;visible=data.samples.filter(s=>f==='all'||f==='silent'&&s.audio.processed_full_silence||f==='audible'&&!s.audio.processed_full_silence||f==='flags'&&s.result?.review_flags.length||f==='nod'&&s.nod?.events.length||f==='no_nod'&&s.nod&&!s.nod.events.length||f==='nod_unchanged'&&s.nod?.events.length&&s.result&&!s.caption_changed);$('sample').replaceChildren(...visible.map((s,i)=>{let o=document.createElement('option');o.value=s.id;o.textContent=`${i+1}/${visible.length} · ${s.short} · ${s.audio.processed_full_silence?'静音':'有声音'}`;return o}));if(visible.length)show(visible.some(s=>s.id===current?.id)?current.id:visible[0].id);}
$('sample').onchange=()=>show($('sample').value);$('filter').onchange=rebuild;for(const [id,delta]of[['prev',-1],['next',1]])$(id).onclick=()=>{const i=visible.findIndex(s=>s.id===current?.id);if(visible.length)show(visible[(i+delta+visible.length)%visible.length].id)};$('speed').onchange=()=>{$('video').playbackRate=+$('speed').value};$('note').oninput=()=>persist();document.querySelectorAll('[data-issue]').forEach(x=>x.onchange=()=>persist());$('good').onclick=()=>persist(true);$('copy').onclick=()=>navigator.clipboard.writeText(current.result?.caption||'');$('export').onclick=()=>{let blob=new Blob([JSON.stringify({schema:'listen-native-caption-human-review-v1',run_id:data.run_id,human_ground_truth:false,records:Object.values(reviews)},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='native-caption-human-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
fetch('review.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{data=d;const s=d.stats;$('summary').textContent=`完成 ${s.completed}/${s.samples} 条 · 净化后有声 ${s.samples-s.full_silence} 条／全静音 ${s.full_silence} 条 · 自然语言输出，不做净化效果消融对照`;if(d.protocol.task==='nod_guided_revision'){$('pageTitle').textContent='高召回点头＋Omni → 整段自然语言描述';$('summary').textContent=`共 ${s.samples} 条 · ${s.nod_candidate_clips} 条有点头候选／${s.nod_candidate_intervals} 个区间 · ${s.nod_word_mentions} 条明确写入 nod · ${s.nod_cues_but_unchanged} 条有候选但原文未变 · 其余 ${s.no_nod_reused} 条直接复用 · 完成 ${s.completed}/${s.samples}`;$('filter').value='nod'}if(d.protocol.task==='nod_guided_direct_annotation'){$('pageTitle').textContent='独立重新打标：视频＋净化音轨＋点头时间线索';$('pageIntro').textContent='Qwen3-Omni · 每条均重新推理。输入只有视频、净化 listener 音轨和点头四字段条目；不输入旧段落，不复用上轮输出。模型原始段落完整展示，尚待人工复核。';$('summary').textContent=`新推理完成 ${s.completed}/${s.samples} 条 · ${s.nod_candidate_clips} 条有补充点头区间 · ${s.samples-s.nod_candidate_clips} 条无补充区间也重新打标 · 旧描述输入 0 条 · 正常结束 ${s.finished_normally} 条／截断 ${s.completed-s.finished_normally} 条`;$('filter').querySelector('option[value="nod_unchanged"]').remove();document.title='Omni · 独立打标＋点头时间线索';}const id=new URLSearchParams(location.search).get('sample');current=data.samples.find(s=>s.id===id);rebuild()}).catch(e=>{$('summary').textContent='加载失败：'+e.message});
</script></html>
