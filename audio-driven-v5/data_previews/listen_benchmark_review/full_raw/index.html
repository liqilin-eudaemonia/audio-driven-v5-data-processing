<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>≥384 原始打标进度</title><style>@font-face{font-family:Review;src:url(review.woff)}body{font-family:Review,system-ui!important}body{font:16px/1.6 system-ui;margin:30px;max-width:1300px;background:#f3f6f8;color:#183243}table{border-collapse:collapse;background:white;width:100%;margin:20px 0}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:26px}.scroll{overflow:auto}</style><h1>原始预裁框 ≥384×384 · 四机 28 卡</h1><p>Qwen3-VL 视觉／Qwen3-Omni listener 音频／ASR＋词时间。按已确认预裁框裁剪到 512×512，保留原始回答，本轮不合并事件。</p><p id="total"></p><p id="updated"></p><div class="scroll"><table><thead><tr><th>分支</th><th>已记录请求</th><th>通过／完成</th><th>输入问题</th><th>其他失败</th><th>近 5 分钟 请求/秒</th><th>完成分片</th></tr></thead><tbody id="branches"></tbody></table><table><thead><tr><th>节点</th><th>CPU 使用率</th><th>CPU IO 等待</th><th>GPU</th><th>GPU 利用率</th><th>显存 GiB</th><th>状态</th><th>batch</th></tr></thead><tbody id="gpus"></tbody></table></div><p>请求包含整段和滑窗，不能把请求数当作已完成的 pair 数。本轮仅包含原始预裁框 ≥384×384 的 722,706 段；结构通过不代表人工核验。</p><pre id="notes"></pre><a href="status.json">完整实时状态 JSON</a><script>const $=id=>document.getElementById(id);async function update(){try{const r=await fetch('status.json?t='+Date.now());if(!r.ok)throw Error(r.status);const d=await r.json();$('total').textContent=`范围：${d.index.queued?.toLocaleString()} 段；每分支约 ${d.index.views_per_branch?.toLocaleString()} 个整段／滑窗请求；缺有效裁框 ${d.index.crop_unavailable?.toLocaleString()} 段。`;$('updated').textContent='更新时间：'+new Date(d.updated_at*1000).toLocaleString();$('branches').innerHTML=Object.entries(d.branches).map(([k,v])=>`<tr><td>${k}</td><td>${v.requests}</td><td>${(v.counts.schema_pass||0)+(v.counts.complete||0)+(v.alignment_repairs_complete||0)}</td><td>${v.counts.preparation_failed||0}</td><td>${v.requests-(v.counts.schema_pass||0)-(v.counts.complete||0)-(v.counts.preparation_failed||0)-(v.alignment_repairs_complete||0)}</td><td>${v.recent_requests_per_s?.toFixed(2)??'积累中'}</td><td>${v.shards_done}/${v.total_shards}</td></tr>`).join('');$('gpus').innerHTML=Object.entries(d.nodes).flatMap(([n,v])=>(v.gpus||[]).map(g=>{const w=d.workers[n+'-g'+g.gpu]||{};return `<tr><td>${n}</td><td>${v.cpu_busy_percent.toFixed(1)}%</td><td>${v.cpu_iowait_percent.toFixed(1)}%</td><td>${g.gpu} · ${w.branch||''}</td><td>${g.gpu_util}%</td><td>${(g.memory_used_mib/1024).toFixed(1)} / ${(g.memory_total_mib/1024).toFixed(1)}</td><td>${w.status||''}</td><td>${w.batch||''}</td></tr>`})).join('');$('notes').textContent=d.optimization_notes.join('\n')}catch(e){$('updated').textContent='状态暂不可读：'+e.message}}update();setInterval(update,15000)</script>
