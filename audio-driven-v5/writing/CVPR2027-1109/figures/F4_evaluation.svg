<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img"><title>F4: Evaluation design — schematic, not results</title><defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#263340"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#637181"/></marker>
<marker id="a-border" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#CBD3DC"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#EAF1F9"/></marker>
<marker id="a-blue_edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#5879A2"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#F0ECF8"/></marker>
<marker id="a-purple_edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#8170A3"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#FFF1DE"/></marker>
<marker id="a-orange_edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#C18438"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#E5F3EF"/></marker>
<marker id="a-teal_edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#408873"/></marker>
<marker id="a-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#FBECE8"/></marker>
<marker id="a-coral_edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#B96A59"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#F5F6F8"/></marker>
<marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#FFFFFF"/></marker>
</defs>
<rect width="1600" height="660" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="28" y="44" font-size="31" text-anchor="start" fill="#263340" font-weight="700">Three questions about generated listening feedback</text>
<text x="28" y="81" font-size="23" text-anchor="start" fill="#637181" font-weight="400">Reference agreement, context, and internal coordination answer different questions.</text>
<rect x="28" y="110" width="492" height="478" rx="10" fill="#E5F3EF" stroke="#408873" stroke-width="1.8"/>
<text x="48" y="149" font-size="23" text-anchor="start" fill="#263340" font-weight="700">(a) Clip-level category agreement</text>
<rect x="554" y="110" width="492" height="478" rx="10" fill="#EAF1F9" stroke="#5879A2" stroke-width="1.8"/>
<text x="574" y="149" font-size="24" text-anchor="start" fill="#263340" font-weight="700">(b) Context and engagement</text>
<rect x="1080" y="110" width="492" height="478" rx="10" fill="#F0ECF8" stroke="#8170A3" stroke-width="1.8"/>
<text x="1100" y="149" font-size="24" text-anchor="start" fill="#263340" font-weight="700">(c) Audiovisual coordination</text>
<text x="49" y="198" font-size="20" text-anchor="start" fill="#263340" font-weight="700">Reference</text>
<path d="M185 195H492" fill="none" stroke="#637181" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<text x="49" y="251" font-size="20" text-anchor="start" fill="#263340" font-weight="700">Generated</text>
<path d="M185 248H492" fill="none" stroke="#637181" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/>
<rect x="213" y="179" width="65" height="25" rx="3" fill="#9FC7BA" stroke="#408873" stroke-width="1.8"/>
<rect x="315" y="179" width="45" height="25" rx="3" fill="#9FC7BA" stroke="#408873" stroke-width="1.8"/>
<rect x="387" y="232" width="65" height="25" rx="3" fill="#9FC7BA" stroke="#408873" stroke-width="1.8"/>
<text x="245" y="225" font-size="17" text-anchor="middle" fill="#408873" font-weight="400">nod</text>
<text x="420" y="284" font-size="17" text-anchor="middle" fill="#408873" font-weight="400">nod</text>
<text x="49" y="327" font-size="21" text-anchor="start" fill="#263340" font-weight="700">Collapse repetition and timing</text>
<path d="M275 345V375" fill="none" stroke="#408873" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal_edge)"/>
<rect x="65" y="389" width="417" height="62" rx="10" fill="#FFFFFF" stroke="#408873" stroke-width="1.8"/>
<text x="273.5" y="428.0" font-size="24" text-anchor="middle" fill="#263340" font-weight="700">{nod}  vs.  {nod}</text>
<text x="49" y="491" font-size="19" text-anchor="start" fill="#637181" font-weight="400">Separate visual / audio P, R, macro-F1</text>
<text x="49" y="521" font-size="19" text-anchor="start" fill="#637181" font-weight="400">Same category; different event times.</text>
<text x="49" y="551" font-size="19" text-anchor="start" fill="#637181" font-weight="400">Agreement is not full appropriateness.</text>
<rect x="579" y="181" width="442" height="72" rx="10" fill="#FFFFFF" stroke="#5879A2" stroke-width="1.8"/>
<text x="800.0" y="225.0" font-size="24" text-anchor="middle" fill="#263340" font-weight="700">Current speaker audio</text>
<text x="579" y="297" font-size="22" text-anchor="start" fill="#263340" font-weight="400">Does the feedback fit this utterance?</text>
<text x="579" y="335" font-size="22" text-anchor="start" fill="#263340" font-weight="400">Does it convey natural engagement?</text>
<text x="579" y="373" font-size="22" text-anchor="start" fill="#263340" font-weight="400">Is it excessive or premature?</text>
<rect x="579" y="414" width="442" height="66" rx="10" fill="#FFFFFF" stroke="#5879A2" stroke-width="1.8"/>
<text x="800.0" y="455.0" font-size="24" text-anchor="middle" fill="#263340" font-weight="700">Generated listener response</text>
<text x="579" y="520" font-size="19" text-anchor="start" fill="#637181" font-weight="400">Different reasonable responses are allowed.</text>
<text x="579" y="550" font-size="19" text-anchor="start" fill="#637181" font-weight="400">Quiet listening can be appropriate.</text>
<text x="1103" y="202" font-size="20" text-anchor="start" fill="#263340" font-weight="700">Generated video</text>
<text x="1103" y="310" font-size="20" text-anchor="start" fill="#263340" font-weight="700">Generated audio</text>
<rect x="1103" y="224" width="440" height="56" rx="5" fill="#FFFFFF" stroke="#CBD3DC" stroke-width="1.8"/>
<text x="1323" y="260" font-size="20" text-anchor="middle" fill="#263340" font-weight="400">facial behavior / mouth movement</text>
<rect x="1103" y="331" width="440" height="56" rx="5" fill="#FFFFFF" stroke="#CBD3DC" stroke-width="1.8"/>
<text x="1323" y="367" font-size="20" text-anchor="middle" fill="#263340" font-weight="400">brief speech / laughter / silence</text>
<path d="M1323 284V304" fill="none" stroke="#8170A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple_edge)"/>
<text x="1103" y="438" font-size="21" text-anchor="start" fill="#263340" font-weight="400">Do sound and movement agree?</text>
<text x="1103" y="469" font-size="21" text-anchor="start" fill="#263340" font-weight="400">Matching category sets alone cannot</text>
<text x="1103" y="500" font-size="21" text-anchor="start" fill="#263340" font-weight="400">establish coordination within the output.</text>
<text x="1103" y="554" font-size="19" text-anchor="start" fill="#637181" font-weight="400">Human protocol: details pending</text>
<text x="28" y="629" font-size="20" text-anchor="start" fill="#637181" font-weight="400">Schematic intervals only. Event detectors, category lists, and human-rating details remain to be finalized.</text>
</g></svg>