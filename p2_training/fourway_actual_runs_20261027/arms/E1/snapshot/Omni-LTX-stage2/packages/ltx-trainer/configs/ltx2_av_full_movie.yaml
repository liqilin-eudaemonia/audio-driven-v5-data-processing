# =============================================================================
# LTX-2 Audio-Video LoRA Training Configuration
# =============================================================================
#
# This configuration is for training LoRA adapters on the LTX-2 model for
# text-to-video generation. It supports both video-only and joint audio-video
# training modes.
#
# Use this configuration when you want to:
#   - Fine-tune LTX-2 on your own video dataset
#   - Train with or without audio generation
#   - Create custom video generation styles or audiovisual concepts
#
# Dataset structure for text-to-video training:
#   preprocessed_data_root/
#   ├── latents/        # Video latents (VAE-encoded videos)
#   ├── conditions/     # Text embeddings for each video
#   └── audio_latents/  # Audio latents (only if with_audio: true)
#
# =============================================================================

# -----------------------------------------------------------------------------
# Model Configuration
# -----------------------------------------------------------------------------
# Specifies the base model to fine-tune and the training mode.
model:
  model_path: "/mnt/data04/480634/728342682@qq.com/2_CKPT/LTX_23/ltx-2.3-22b-dev.safetensors"
  text_encoder_path: "/mnt/data04/480634/public/2_CKPT/0_WM/LTX2.0_TEXT_ENCODER"
  training_mode: "full"
  load_checkpoint: "/data/jsfeng/LTX-2/packages/ltx-trainer/outputs/ltx2_av_movie_p10/checkpoints/model_weights_step_03000.safetensors"

# -----------------------------------------------------------------------------
# LoRA Configuration
# -----------------------------------------------------------------------------
# Controls the Low-Rank Adaptation parameters for efficient fine-tuning.
lora:
  # Rank of the LoRA matrices (higher = more capacity but more parameters)
  # Typical values: 8, 16, 32, 64. Start with 32 for general fine-tuning.
  rank: 32

  # Alpha scaling factor (usually set equal to rank)
  # The effective scaling is alpha/rank, so alpha=rank means scaling of 1.0
  alpha: 32

  # Dropout probability for LoRA layers (0.0 = no dropout)
  # Can help with regularization if overfitting occurs
  dropout: 0.0

  # Which transformer modules to apply LoRA to
  # The LTX-2 transformer has separate attention and FFN blocks for video and audio:
  #
  # VIDEO MODULES:
  #   - attn1.to_k, attn1.to_q, attn1.to_v, attn1.to_out.0  (video self-attention)
  #   - attn2.to_k, attn2.to_q, attn2.to_v, attn2.to_out.0  (video cross-attention to text)
  #   - ff.net.0.proj, ff.net.2                             (video feed-forward)
  #
  # AUDIO MODULES:
  #   - audio_attn1.to_k, audio_attn1.to_q, audio_attn1.to_v, audio_attn1.to_out.0  (audio self-attention)
  #   - audio_attn2.to_k, audio_attn2.to_q, audio_attn2.to_v, audio_attn2.to_out.0  (audio cross-attention to text)
  #   - audio_ff.net.0.proj, audio_ff.net.2                                         (audio feed-forward)
  #
  # AUDIO-VIDEO CROSS-ATTENTION MODULES (for cross-modal interaction):
  #   - audio_to_video_attn.to_k, audio_to_video_attn.to_q, audio_to_video_attn.to_v, audio_to_video_attn.to_out.0
  #       (Q from video, K/V from audio - allows video to attend to audio features)
  #   - video_to_audio_attn.to_k, video_to_audio_attn.to_q, video_to_audio_attn.to_v, video_to_audio_attn.to_out.0
  #       (Q from audio, K/V from video - allows audio to attend to video features)
  #
  # Using short patterns like "to_k" matches ALL attention modules (video, audio, and cross-modal).
  # For audio-video training, this is the recommended approach.
  target_modules:
    # Attention layers (matches both video and audio branches)
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"
    # Uncomment below to also train feed-forward layers (can increase the LoRA's capacity):
    # - "ff.net.0.proj"
    # - "ff.net.2"
    # - "audio_ff.net.0.proj"
    # - "audio_ff.net.2"

# -----------------------------------------------------------------------------
# Training Strategy Configuration
# -----------------------------------------------------------------------------
# Defines the text-to-video training approach.
training_strategy:
  # Strategy name: "text_to_video" for standard text-to-video training
  name: "text_to_video"

  # Probability of conditioning on the first frame during training
  # Higher values train the model to perform better in image-to-video (I2V) mode,
  # where a clean first frame is provided and the model generates the rest of the video
  # Increase this value to train the model to perform better in image-to-video (I2V) mode
  first_frame_conditioning_p: 1.0

  # Enable joint audio-video training
  # Set to true if your dataset includes audio and you want to train the audio branch
  with_audio: true

  # Directory name (within preprocessed_data_root) containing audio latents
  # Only used when with_audio is true
  audio_latents_dir: "audio_latents"

# -----------------------------------------------------------------------------
# Optimization Configuration
# -----------------------------------------------------------------------------
# Controls the training optimization parameters.
optimization:
  # Learning rate for the optimizer
  # Typical range for LoRA: 1e-5 to 1e-4
  learning_rate: 1e-4

  # Total number of training steps
  steps: 10000

  # Batch size per GPU
  # Reduce if running out of memory
  batch_size: 1

  # Number of gradient accumulation steps
  # Effective batch size = batch_size * gradient_accumulation_steps * num_gpus
  gradient_accumulation_steps: 10

  # Maximum gradient norm for clipping (helps training stability)
  max_grad_norm: 1.0

  # Optimizer type: "adamw" (standard) or "adamw8bit" (memory-efficient)
  optimizer_type: "adamw"

  # Learning rate scheduler type
  # Options: "constant", "linear", "cosine", "cosine_with_restarts", "polynomial"
  scheduler_type: "linear"

  # Additional scheduler parameters (depends on scheduler_type)
  scheduler_params: { }

  # Enable gradient checkpointing to reduce memory usage
  # Recommended for training with limited GPU memory
  enable_gradient_checkpointing: true

# -----------------------------------------------------------------------------
# Acceleration Configuration
# -----------------------------------------------------------------------------
# Hardware acceleration and memory optimization settings.
acceleration:
  # Mixed precision training mode
  # Options: "no" (fp32), "fp16" (half precision), "bf16" (bfloat16, recommended)
  mixed_precision_mode: "bf16"

  # Model quantization for reduced memory usage
  # Options: null (none), "int8-quanto", "int4-quanto", "int2-quanto", "fp8-quanto", "fp8uz-quanto"
  quantization: null

  # Load text encoder in 8-bit precision to save memory
  # Useful when GPU memory is limited
  load_text_encoder_in_8bit: false

  # Offload optimizer state to CPU during validation video sampling.
  # Helps avoid OOM when VAE decoder + transformer + optimizer state can't coexist
  # on the GPU (full fine-tune, high-rank LoRA). No effect for FSDP.
  offload_optimizer_during_validation: false

# -----------------------------------------------------------------------------
# Data Configuration
# -----------------------------------------------------------------------------
# Specifies the training data location and loading parameters.
data:
  preprocessed_data_root: "/mnt/data04/480634/public/1_FEATURE/1_AUDIO/LTX23/avgen_data/precomputed_ltx121_av"

  # Number of worker processes for data loading
  # Used for parallel data loading to speed up data loading
  num_dataloader_workers: 2

# -----------------------------------------------------------------------------
# Validation Configuration
# -----------------------------------------------------------------------------
# Controls validation video generation during training.
# NOTE: Validation sampling use simplified inference pipelines and prioritizes speed over
# maximum quality. For production-quality inference, use `packages/ltx-pipelines`.
validation:
  # Text prompts for validation video generation
  # Provide prompts representative of your training data
  # LTX-2 prefers longer, detailed prompts that describe both visual content and audio
  prompts:
    - "[SCENE]lighting: dim, cool-toned blue and gray; location type: inside a vehicle; composition: close-up of a man seen through a reflective windshield[END_SCENE] [CHARATER_OBJECT] appearance: middle-aged man with short brown hair, wearing a dark jacket; posture: seated, slightly leaning forward; spatial relations: behind the steering wheel; actions: holding a cell phone to his left ear, looking forward with a serious and slightly confused expression[END_CHARATER_OBJECT] [SENSORY] background elements: reflections of trees and streetlights on the windshield glass, steering wheel visible at the bottom; atmosphere: suspenseful, serious; materials: glass, plastic, fabric; colors: dark blue, gray, pale skin tones[END_SENSORY] [DIALOGUE_SEQUENCE] [WORDS]I like that.[END_WORDS] [ACTION]speaks calmly while listening to the phone, eyes fixed forward[END_ACTION] [ENVIRONMENT_CONTINUATION]static frame; focus is on the man's face through the glass[END_ENVIRONMENT_CONTINUATION] [WORDS]What?[END_WORDS] [ACTION]his expression shifts to one of confusion and concern as he responds to the person on the line[END_ACTION] [ENVIRONMENT_CONTINUATION]static frame; the reflections on the windshield remain steady[END_ENVIRONMENT_CONTINUATION] [END_DIALOGUE_SEQUENCE] [AUDIO_CAPTION]A deep, resonant male voice speaks with a steady, inquisitive tone over a low, ambient hum of a vehicle interior.[END_AUDIO_CAPTION]"
    - "[SCENE]lighting: artificial, slightly dim; location type: indoor hospital nurse's station; composition: medium shot of three people behind a counter[END_SCENE] [CHARATER_OBJECT] appearance: man on left has glasses, balding head, wears white lab coat over green shirt; man in center is tall with goatee, wears light blue lab coat and striped tie; woman on right has dark hair in bun, wears pink scrubs over striped shirt and stethoscope; posture: all standing behind a high counter; spatial relations: grouped together in a workspace; actions: man on left flips paper on clipboard and writes; woman on right flips through a yellow folder[END_CHARATER_OBJECT] [SENSORY] background elements: clinical charts, medical equipment, cardboard boxes, blurred hospital corridor in background; atmosphere: busy, professional yet casual; materials: paper, plastic, metal, fabric; colors: white, light blue, pink, muted greens and browns[END_SENSORY] [DIALOGUE_SEQUENCE] [WORDS]What's wrong with Carly?[END_WORDS] [ACTION]woman in pink scrubs looks at the folder while speaking[END_ACTION] [ENVIRONMENT_CONTINUATION]static frame, background characters moving slightly[END_ENVIRONMENT_CONTINUATION] [WORDS]Don't start. We had to make room for Heather.[END_WORDS] [ACTION]man in white lab coat responds without looking up from his clipboard, continues writing[END_ACTION] [ENVIRONMENT_CONTINUATION]static frame[END_ENVIRONMENT_CONTINUATION] [WORDS]So you got the one with the-[END_WORDS] [ACTION]woman looks up at the man and smiles while finishing the sentence[END_ACTION] [ENVIRONMENT_CONTINUATION]no camera movement[END_ENVIRONMENT_CONTINUATION] [END_DIALOGUE_SEQUENCE] [AUDIO_CAPTION]Clear, naturalistic dialogue between multiple people in a busy indoor environment, accompanied by the rustling of paper and clicking of pens against clipboards, set against a low-level background of hospital activity.[END_AUDIO_CAPTION]"
    - "[SCENE]lighting: dim, warm, localized; location type: indoor bedroom; composition: medium close-up of a couple in bed[END_SCENE] [CHARATER_OBJECT] appearance: shirtless man with dark hair, woman with dark wavy hair; posture: man sitting up leaning on pillows, woman lying down tucked under covers; spatial relations: side-by-side in bed; actions: man folds newspaper and sets it down, woman watches him and speaks[END_CHARATER_OBJECT] [SENSORY] background elements: ornate gold-trimmed headboard, pink pillows, floral patterned sheets; atmosphere: quiet, intimate, nostalgic; materials: paper, cotton fabric, wood; colors: dark shadows, soft pink, white, flesh tones[END_SENSORY] [DIALOGUE_SEQUENCE] [WORDS]The music end.[END_WORDS] [ACTION]man looks down at the newspaper while speaking[END_ACTION] [ENVIRONMENT_CONTINUATION]static frame; focus on man's face and torso[END_ENVIRONMENT_CONTINUATION] [ACTION]man folds the newspaper with both hands and places it on the bed[END_ACTION] [WORDS]That's the place I got him. On fourth, right near the gaslight. You'd love it.[END_WORDS] [ACTION]woman looks up at him, speaking softly while gesturing with her hand[END_ACTION] [ENVIRONMENT_CONTINUATION]no camera movement; man turns his head to meet her gaze at the end of her sentence[END_ENVIRONMENT_CONTINUATION] [END_DIALOGUE_SEQUENCE] [AUDIO_CAPTION]Soft, low-pitched male and female voices speaking in a quiet, intimate indoor setting, followed by the crisp, dry rustling sound of paper being folded and placed on fabric.[END_AUDIO_CAPTION]"
    
  # Negative prompt to avoid unwanted artifacts
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"

  # Optional: First frame images for image-to-video validation
  # If provided, must have one image per prompt
  images: 
    - "/mnt/data04/480634/728342682@qq.com/4_RESULT/1_AUDIO/test_case/i2v/沉默生机 赎命密码_1.png"
    - "/mnt/data04/480634/728342682@qq.com/4_RESULT/1_AUDIO/test_case/i2v/急诊室的故事_1.png"
    - "/mnt/data04/480634/728342682@qq.com/4_RESULT/1_AUDIO/test_case/i2v/了不起的麦瑟尔夫人_1.png"
  # Output video dimensions [width, height, frames]
  # Width and height must be divisible by 32
  # Frames must satisfy: frames % 8 == 1 (e.g., 1, 9, 17, 25, 33, 41, 49, 57, 65, 73, 81, 89, ...)
  video_dims: [ 960, 544, 121 ]

  # Frame rate for generated videos
  frame_rate: 24.0

  # Random seed for reproducible validation outputs
  seed: 42

  # Number of denoising steps for validation inference
  # Higher values = better quality but slower generation
  inference_steps: 30

  # Generate validation videos every N training steps
  # Set to null to disable validation during training
  interval: 100

  # Classifier-free guidance scale
  # Higher values = stronger adherence to prompt but may introduce artifacts
  guidance_scale: 4.0

  # STG (Spatio-Temporal Guidance) parameters for improved video quality
  # STG is combined with CFG for better temporal coherence
  stg_scale: 1.0  # Recommended: 1.0 (0.0 disables STG)
  stg_blocks: [29]  # Recommended: single block 29
  stg_mode: "stg_av"  # "stg_av" perturbs both audio and video, "stg_v" video only

  # Whether to generate audio in validation samples
  # Independent of training_strategy.with_audio - you can generate audio
  # in validation even when not training the audio branch
  generate_audio: true

  # Skip validation at the beginning of training (step 0)
  skip_initial_validation: false

# -----------------------------------------------------------------------------
# Checkpoint Configuration
# -----------------------------------------------------------------------------
# Controls model checkpoint saving during training.
checkpoints:
  # Save a checkpoint every N steps
  # Set to null to disable intermediate checkpoints
  interval: 1000

  # Number of most recent checkpoints to keep
  # Set to -1 to keep all checkpoints
  keep_last_n: -1

  # Precision to use when saving checkpoint weights
  # Options: "bfloat16" (default, smaller files) or "float32" (full precision)
  precision: "bfloat16"

  # Resume scheduler/RNG/global step from training_state_step_03000.pt next to the loaded checkpoint.
  # Keep false when continuing an interrupted run; set true only to reuse weights but restart training from step 0.
  no_resume: false

# -----------------------------------------------------------------------------
# Flow Matching Configuration
# -----------------------------------------------------------------------------
# Parameters for the flow matching training objective.
flow_matching:
  # Timestep sampling mode
  # "shifted_logit_normal" is recommended for LTX-2 models
  timestep_sampling_mode: "shifted_logit_normal"

  # Additional parameters for timestep sampling
  timestep_sampling_params: { }

# -----------------------------------------------------------------------------
# Hugging Face Hub Configuration
# -----------------------------------------------------------------------------
# Settings for uploading trained models to the Hugging Face Hub.
hub:
  # Whether to push the trained model to the Hub
  push_to_hub: false

  # Repository ID on Hugging Face Hub (e.g., "username/my-lora-model")
  # Required if push_to_hub is true
  hub_model_id: null

# -----------------------------------------------------------------------------
# Weights & Biases Configuration
# -----------------------------------------------------------------------------
# Settings for experiment tracking with W&B.
wandb:
  # Enable W&B logging
  enabled: true

  # W&B project name
  project: "ltx-23-trainer"

  # W&B username or team (null uses default account)
  entity: fengjeffs-xi-an-jiaotong-university-

  # Tags to help organize runs
  tags: [ "ltx2", "full", "movie" ]

  # Log validation videos to W&B
  log_validation_videos: true

  # Start a new W&B run while still resuming model/scheduler/RNG state from checkpoint.
  resume_run: false

# -----------------------------------------------------------------------------
# General Configuration
# -----------------------------------------------------------------------------
# Global settings for the training run.

# Random seed for reproducibility
seed: 42

# Directory to save outputs (checkpoints, validation videos, logs)
output_dir: "outputs/ltx2_av_movie_p10_resume"
